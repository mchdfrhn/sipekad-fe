# Push to main -> build the static-only frontend image and push it to GHCR (sha-<7> and latest).
# This repo is PUBLIC: the VPS address lives in a secret, never in a variable or a log line.
# The deploy job stays off until the repo variable VPS_DEPLOY is set to "true".
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mchdfrhn/sipekad-fe

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_WHATSAPP_NUMBER=${{ vars.VITE_WHATSAPP_NUMBER }}
            NGINX_CONF=nginx.static.conf.template
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ vars.VPS_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-sipekad-fe
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              "deploy@${VPS_HOST}" "deploy-sipekad fe ${GITHUB_SHA::7}"
